name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Official Python images keep versions that the runner images no longer ship (3.9 is gone from Ubuntu 26.04).
    container: python:${{ matrix.python-version }}-slim
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - name: Unit and end-to-end tests
        run: python -m unittest discover -s tests -v
      - name: Package the builder for claude.ai
        run: python tools/make_release.py
